[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "goliathapp-enterprise-concepts"
version = "0.1.0"
description = "GoliathApp: Enterprise Application Concepts — Goliath Research Academy"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "marimo>=0.11.0",
    "psycopg[binary]>=3.2.0",
    "pytest>=8.3.0",
]

[tool.setuptools]
packages = ["course_support"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "."]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib"
norecursedirs = [".lab", ".git", ".venv", "node_modules"]

[tool.ruff]
line-length = 140
target-version = "py311"
